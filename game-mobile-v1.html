</main><script src="../src/level-core.js"></script><script src="../src/level-100.js"></script><script>

function update(){
 const state=session.state();

function startClock(){if(started)return;started=Date.now();clock=setInterval(()=>{elapsed=Math.floor((Date.now()-started)/1000);update()},400)}
function flipFace(tile,on){tile.button.classList.toggle("open",on);tile.button.setAttribute("aria-label",on?tile.emoji:"Kapalı kart")}
function matchVisual(a,b){for(const t of [a,b]){t.button.classList.remove("hit","bad");t.button.classList.add("matched");flipFace(t,true)}}
function syncLocks(){
 const state=session.state(), frozen=new Set(state.frozenSymbols);
 tiles.forEach(t=>{
   const hidden=GAME.LEVELS[levelIndex].type==="waves" && state.visiblePairs<GAME.LEVELS[levelIndex].pairs && t.waveHidden;
   t.button.classList.toggle("frozen",frozen.has(t.emoji));
   t.button.classList.toggle("wave-hidden",hidden);
   t.button.disabled=hidden||frozen.has(t.emoji)||t.button.classList.contains("matched");
 });
}
function tileFor(emoji,index,hidden=false){
 const cell=document.createElement("div");cell.className="cell";
 const b=document.createElement("button");b.type="button";b.className="card spawn";b.innerHTML='<span class="card-inner"><span class="card-back"></span><span class="card-front"></span></span>';
 b.querySelector(".card-front").textContent=emoji;
 b.style.animationDelay=(index%8)*32+"ms";
 cell.appendChild(b);
 const t={emoji,index,button:b,waveHidden:hidden};tiles.push(t);
 b.onclick=()=>flip(t);
 return cell;
}
function render(){
 clearAsync();serial++;started=0;elapsed=0;firstCard=null;tiles=[];
 const level=GAME.LEVELS[levelIndex], type=level.type;
 deck=CORE.uniquePairDeck(GAME.WORLDS[level.world].emojis,level.pairs);
 session=CORE.createSession(level,deck);
 const cols=type==="shape"?4:level.pairs<=3?2:level.pairs>=9?4:3;
 const board=$("board");board.replaceChildren();board.style.setProperty("--columns",cols);board.style.setProperty("--rows",Math.ceil((level.pairs*2+(type==="shape"?4:0))/cols));board.dataset.shape=String(type==="shape");
 const world=GAME.WORLDS[level.world];
 $("mode-name").textContent=LABELS[type];$("mode-desc").textContent=DESCS[type];
 $("mode-tag").textContent=world.icon+" "+world.name+" · "+(type==="classic"?"KLASİK":"ÖZEL");
 document.getElementById("app").dataset.world=String(level.world);
 $("result").classList.add("hidden");$("preview-text").classList.add("hidden");
 const waveHidden=new Set(type==="waves"?[...new Set(deck)].slice(3):[]);
 const holeCount=type==="shape"?4:0;
 const total=cols*Math.ceil((deck.length+holeCount)/cols);
 const holes=new Set();
 if(type==="shape"){for(let i=2;holes.size<total-deck.length&&i<total;i+=3)holes.add(i);for(let i=0;holes.size<total-deck.length&&i<total;i++)holes.add(i)}
 let index=0;
 for(let i=0;i<total;i++){
   if(holes.has(i)){const cell=document.createElement("div");cell.className="cell";cell.innerHTML='<div class="hole" aria-hidden="true"></div>';board.append(cell)}
   else if(index<deck.length){board.append(tileFor(deck[index],index,waveHidden.has(deck[index])));index++}
 }
 if(index!==deck.length)throw Error("Board layout mismatch");
 syncLocks();update();
 if(type==="preview"){
   tiles.forEach(t=>flipFace(t,true));
   const note=$("preview-text");note.classList.remove("hidden");
   let remaining=levelIndex>=16?2:3;
   function countdown(){
     if(remaining>0){note.textContent="Hatırla · "+remaining;remaining--;later(countdown,1000)}
     else{tiles.forEach(t=>flipFace(t,false));note.classList.add("hidden");
       session.dispatch({type:"preview-end",generation:session.state().generation})}
   }
   countdown();
 }
}
function flip(tile){
 const state=session.state();
 const response=session.dispatch({type:"flip",index:tile.index,generation:state.generation});
 if(!response.accepted)return;
 if(!started)startClock();
 flipFace(tile,true);
 if(response.event==="first-flip"){firstCard=tile;return}
 const previous=firstCard;firstCard=null;
 if(!previous)throw Error("Missing first card");
 if(response.event==="match-pending"){previous.button.classList.add("hit");tile.button.classList.add("hit")}
 else {previous.button.classList.add("bad");tile.button.classList.add("bad")}
 update();
 const generation=response.state.generation;
 later(()=>{
   const result=session.dispatch({type:"settle",generation});
   if(!result.accepted)return;
   if(result.event==="match-settled"){
     matchVisual(previous,tile);
     syncLocks();
     if(GAME.LEVELS[levelIndex].type==="waves"&&result.state.visiblePairs===GAME.LEVELS[levelIndex].pairs){
       const note=$("preview-text");note.textContent="Yeni kartlar açıldı!";note.classList.remove("hidden");
       later(()=>note.classList.add("hidden"),650)
     }
     if(result.state.phase==="completed"){
       clearInterval(clock);elapsed=started?Math.floor((Date.now()-started)/1000):0;
       const goal=Math.ceil(GAME.LEVELS[levelIndex].pairs*1.8);
       const medal=GAME.LEVELS[levelIndex].type==="budget"?(result.state.moves<=goal?"🏆 Altın hedef! ":"⭐ Bölüm tamamlandı. "):"🎉 ";
       $("result").textContent=medal+result.state.moves+" hamle · "+format(elapsed)+" süre";
       $("result").classList.remove("hidden");
       if(levelIndex+1===unlocked&&unlocked<GAME.COUNT){unlocked++;persist()}
       else if(levelIndex===GAME.COUNT-1){$("result").textContent+=" · Tebrikler, 100 bölüm tamamlandı!"}
     }
   }else{
     for(const t of [previous,tile]){t.button.classList.remove("bad");flipFace(t,false)}
   }
   update();
 },response.event==="match-pending"?380:780);
}
$("previous").onclick=()=>{if(levelIndex>0){levelIndex--;render()}};
$("next").onclick=()=>{if(levelIndex+2<=unlocked&&levelIndex+1<GAME.COUNT){levelIndex++;render()}};
$("advance").onclick=()=>{if(levelIndex+2<=unlocked&&levelIndex+1<GAME.COUNT){levelIndex++;render()}};
$("restart").onclick=render;

render();
</script></body></html>
